<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="418" viewBox="0 0 1080 418" role="img" aria-label="Pick and place rates with 95 percent Wilson intervals for the stock cell and the Blender-dressed hall; switching the visual servo off drops placement to 60 percent">

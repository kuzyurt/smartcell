<svg xmlns="http://www.w3.org/2000/svg" width="980" height="462" viewBox="0 0 980 462" role="img" aria-label="Place rate with 95 percent Wilson interval for the stock cell and the Blender-dressed hall; switching the visual servo off drops placement to 60 percent">

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="512" viewBox="0 0 1080 512" role="img" aria-labelledby="t d">
  <title id="t">Pick and place results for the frozen smartcell controller</title>
  <desc id="d">Two panels: 200 fresh seeds per stock-cell condition, and the zero-shot Blender-dressed scene. Bars show pick and place rates; whiskers show full Wilson 95% intervals.</desc>

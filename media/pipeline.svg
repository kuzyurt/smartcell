<svg xmlns="http://www.w3.org/2000/svg" width="930" height="200" viewBox="0 0 930 200" role="img" aria-label="Training loop: expert, train, DAgger corrections feeding back, then freeze and test">
<title>Training loop: expert, train, DAgger corrections feeding back, then freeze and test</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.h{font-size:17px;font-weight:650}.l{font-size:13.5px}.t{font-size:13px;fill:#59636e}.w{fill:#fff}
.box{fill:#fff;stroke:#1f2328;stroke-width:1.4}.fill{fill:#0b7a75}.ar{fill:none;stroke:#1f2328;stroke-width:1.6}
.hair{stroke:#e1e6ea;stroke-width:1;fill:none}.acc{fill:#0b7a75}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#1f2328" d="M1 1.5L8.5 5L1 8.5z"/></marker></defs>
<rect x=".5" y=".5" width="929" height="199" rx="10" fill="#fff" stroke="#d1d9e0"/>
<circle class="acc" cx="41" cy="46" r="13"/><text class="h w" x="41" y="52" text-anchor="middle" style="font-size:14px">1</text>
<text class="h" x="64" y="52">Expert</text>
<text x="64" y="80">243 demonstrations</text>
<path class="ar" d="M204 46H238" marker-end="url(#a)"/>
<circle class="acc" cx="261" cy="46" r="13"/><text class="h w" x="261" y="52" text-anchor="middle" style="font-size:14px">2</text>
<text class="h" x="284" y="52">Train</text>
<text x="284" y="80">behaviour cloning,</text>
<text x="284" y="100">549,436 samples</text>
<path class="ar" d="M424 46H458" marker-end="url(#a)"/>
<circle class="acc" cx="481" cy="46" r="13"/><text class="h w" x="481" y="52" text-anchor="middle" style="font-size:14px">3</text>
<text class="h" x="504" y="52">DAgger</text>
<text x="504" y="80">948 corrections from</text>
<text x="504" y="100">states the policy visits</text>
<path class="ar" d="M644 46H678" marker-end="url(#a)"/>
<circle class="acc" cx="701" cy="46" r="13"/><text class="h w" x="701" y="52" text-anchor="middle" style="font-size:14px">4</text>
<text class="h" x="724" y="52">Freeze and test</text>
<text x="724" y="80">600 trials on</text>
<text x="724" y="100">unseen seeds</text>
<path class="ar" d="M481 128V154H261V132" marker-end="url(#a)"/>
<text class="l" x="371.0" y="178" text-anchor="middle">corrections go back into training</text>
</svg>

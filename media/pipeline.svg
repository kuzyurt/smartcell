<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="175" viewBox="0 0 1100 175" role="img" aria-label="Training loop: expert, train, DAgger corrections feeding back, then freeze and test">
<title>Training loop: expert, train, DAgger corrections feeding back, then freeze and test</title>
<style>
:root{--ink:#1f2328;--line:#d1d9e0;--acc:#0b7a75;--on:#ffffff}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#3d444d;--acc:#3dbdb2;--on:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:13px}
.h{font-size:16px;font-weight:650}
.l{font-size:12.5px}
.t{font-size:12px;opacity:.7}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.fill{fill:var(--acc);stroke:none}
.on{fill:var(--on)}
.ar{fill:none;stroke:var(--ink);stroke-width:1.5}
.hair{stroke:var(--line);stroke-width:1;fill:none}
.head{fill:var(--ink)}
.ptp{stroke:var(--ink);stroke-width:2;fill:none}
.pl{fill:var(--acc)}
.ph{fill:var(--ink)}
.dot{fill:var(--acc)}
.cic{fill:var(--acc)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M1 1.5L8.5 5L1 8.5z"/></marker></defs>
<circle class="cic" cx="32" cy="40" r="12"/>
<text class="h on" x="32" y="45.5" text-anchor="middle" style="font-size:13px">1</text>
<text class="h" x="54" y="45">Expert</text>
<text x="54" y="72">243 demonstrations</text>
<path class="ar" d="M252 40H292" marker-end="url(#a)"/>
<circle class="cic" cx="312" cy="40" r="12"/>
<text class="h on" x="312" y="45.5" text-anchor="middle" style="font-size:13px">2</text>
<text class="h" x="334" y="45">Train</text>
<text x="334" y="72">behaviour cloning,</text>
<text x="334" y="90">549,436 samples</text>
<path class="ar" d="M532 40H572" marker-end="url(#a)"/>
<circle class="cic" cx="592" cy="40" r="12"/>
<text class="h on" x="592" y="45.5" text-anchor="middle" style="font-size:13px">3</text>
<text class="h" x="614" y="45">DAgger</text>
<text x="614" y="72">948 corrections from</text>
<text x="614" y="90">states the policy visits</text>
<path class="ar" d="M812 40H852" marker-end="url(#a)"/>
<circle class="cic" cx="872" cy="40" r="12"/>
<text class="h on" x="872" y="45.5" text-anchor="middle" style="font-size:13px">4</text>
<text class="h" x="894" y="45">Freeze and test</text>
<text x="894" y="72">600 trials on</text>
<text x="894" y="90">unseen seeds</text>
<path class="ar" d="M652 112V140H386V118" marker-end="url(#a)"/>
<text class="l" x="519" y="162" text-anchor="middle">corrections go back into training</text>
</svg>

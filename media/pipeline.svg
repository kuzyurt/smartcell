<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250" role="img" aria-labelledby="t d">
  <title id="t">Training pipeline: expert, DAgger, training, evaluation</title>
  <desc id="d">An expert controller records demonstrations. The trained policy is rolled out, the expert corrects the states it visits, and those corrections are added to training. The frozen checkpoint is evaluated on fresh seeds.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 2 L 7.5 5 L 1 8 Z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #0d1117; }
      .title { fill: #f0f6fc; font-size: 17px; font-weight: 650; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.1; }
      .blue { fill: #0d1b2e; stroke: #388bfd; stroke-width: 1.2; }
      .green { fill: #0f1f14; stroke: #3fb950; stroke-width: 1.2; }
      .h { fill: #f0f6fc; font-size: 13.5px; font-weight: 650; }
      .b { fill: #c9d1d9; font-size: 11.5px; }
      .d { fill: #8b949e; font-size: 11px; }
      .ln { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect class="bg" width="1080" height="250" rx="10"/>
  <text class="title" x="28" y="36">From demonstrations to a frozen checkpoint</text>

  <rect class="box" x="28" y="62" width="220" height="104" rx="8"/>
  <text class="h" x="44" y="88">1 · Expert</text>
  <text class="b" x="44" y="110">scripted pick/place</text>
  <text class="b" x="44" y="127">controller, IK-based</text>
  <text class="d" x="44" y="152">243 demonstrations</text>

  <rect class="box" x="296" y="62" width="220" height="104" rx="8"/>
  <text class="h" x="312" y="88">2 · Train</text>
  <text class="b" x="312" y="110">behaviour cloning on wrist</text>
  <text class="b" x="312" y="127">frames + SOLL/IST proprio</text>
  <text class="d" x="312" y="152">549,436 samples</text>

  <rect class="blue" x="564" y="62" width="220" height="104" rx="8"/>
  <text class="h" x="580" y="88">3 · DAgger</text>
  <text class="b" x="580" y="110">run the policy, let the expert</text>
  <text class="b" x="580" y="127">correct states it really visits</text>
  <text class="d" x="580" y="152">948 corrections</text>

  <rect class="green" x="832" y="62" width="220" height="104" rx="8"/>
  <text class="h" x="848" y="88">4 · Freeze + evaluate</text>
  <text class="b" x="848" y="110">fresh seeds, strict place</text>
  <text class="b" x="848" y="127">metric, no tuning afterwards</text>
  <text class="d" x="848" y="152">600 trials, 3 conditions</text>

  <path class="ln" d="M 250 114 L 292 114"/>
  <path class="ln" d="M 518 114 L 560 114"/>
  <path class="ln" d="M 786 114 L 828 114"/>
  <path class="ln" d="M 674 168 C 674 214, 406 214, 406 170"/>
  <text class="d" x="540" y="232" text-anchor="middle">corrections go back into training</text>
</svg>

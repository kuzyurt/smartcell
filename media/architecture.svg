<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="324" viewBox="0 0 1028 324" role="img" aria-label="Control pipeline: policy, visual servo and release primitive in series, each reading sensors, driving the SO-101">
<title>Control pipeline: policy, visual servo and release primitive in series, each reading sensors, driving the SO-101</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.h{font-size:17px;font-weight:650}.l{font-size:13.5px}.t{font-size:13px;fill:#59636e}.w{fill:#fff}
.box{fill:#fff;stroke:#1f2328;stroke-width:1.4}.fill{fill:#0b7a75}.ar{fill:none;stroke:#1f2328;stroke-width:1.6}
.hair{stroke:#e1e6ea;stroke-width:1;fill:none}.acc{fill:#0b7a75}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#1f2328" d="M1 1.5L8.5 5L1 8.5z"/></marker></defs>
<rect x=".5" y=".5" width="1027" height="323" rx="10" fill="#fff" stroke="#d1d9e0"/>
<rect class="box" x="28" y="36" width="170" height="90" rx="8"/>
<text class="h" x="113.0" y="76" text-anchor="middle">Policy</text>
<text class="" x="113.0" y="100" text-anchor="middle">learned, frozen</text>
<rect class="box" x="298" y="36" width="170" height="90" rx="8"/>
<text class="h" x="383.0" y="76" text-anchor="middle">Visual servo</text>
<text class="" x="383.0" y="100" text-anchor="middle">geometry, no learning</text>
<rect class="box" x="568" y="36" width="170" height="90" rx="8"/>
<text class="h" x="653.0" y="76" text-anchor="middle">Release primitive</text>
<text class="" x="653.0" y="100" text-anchor="middle">rules on joint state</text>
<rect class="fill" x="838" y="36" width="170" height="90" rx="8"/>
<text class="h w" x="923.0" y="76" text-anchor="middle">SO-101</text>
<text class="w" x="923.0" y="100" text-anchor="middle">6 joints + gripper</text>
<path class="ar" d="M202 92H293" marker-end="url(#a)"/>
<text class="l" x="248.0" y="68" text-anchor="middle">arm + grip</text><text class="l" x="248.0" y="84" text-anchor="middle">target</text>
<path class="ar" d="M472 92H563" marker-end="url(#a)"/>
<text class="l" x="518.0" y="68" text-anchor="middle">corrected</text><text class="l" x="518.0" y="84" text-anchor="middle">target</text>
<path class="ar" d="M742 92H833" marker-end="url(#a)"/>
<text class="l" x="788.0" y="68" text-anchor="middle">arm + grip</text><text class="l" x="788.0" y="84" text-anchor="middle">command</text>
<rect class="box" x="28" y="236" width="740" height="60" rx="8"/><text class="h" x="50" y="272">Sensors</text>
<text x="140" y="271">wrist camera  ·  joint angles, measured and commanded</text>
<path class="ar" d="M113 233V130" marker-end="url(#a)"/><text class="l" x="123" y="188">8 gray frames + joints</text>
<path class="ar" d="M383 233V130" marker-end="url(#a)"/><text class="l" x="393" y="188">RGB frame</text>
<path class="ar" d="M653 233V130" marker-end="url(#a)"/><text class="l" x="663" y="188">gripper error, lift height</text>
<path class="ar" d="M923 130V266H772" marker-end="url(#a)"/><text class="l" x="782" y="256">25 Hz</text>
</svg>
